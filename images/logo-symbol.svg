<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 渐变色定义，展现科技与娱乐的融合 -->
    <linearGradient id="vireuli-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>
  <!-- 背景裁剪圆角，适配标准的图标形态 -->
  <rect width="512" height="512" rx="112" fill="#0D1117"/>
  <g transform="translate(32, 32)">
    <!-- 外层多端协同波束 -->
    <path d="M 120 340 A 180 180 0 0 1 120 108" fill="none" stroke="url(#vireuli-grad)" stroke-width="28" stroke-linecap="round" opacity="0.4" />
    <path d="M 170 300 A 130 130 0 0 1 170 148" fill="none" stroke="url(#vireuli-grad)" stroke-width="28" stroke-linecap="round" opacity="0.7" />
    <!-- 核心播放控制中心 -->
    <path d="M 220 160 L 330 224 L 220 288 Z" fill="url(#vireuli-grad)" stroke="url(#vireuli-grad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>
